# fiscode web — nginx config for serving the Vite SPA bundle.
#
# Three load-bearing pieces:
#   1. SPA fallback: every non-asset request falls back to /index.html so
#      TanStack Router's client-side routing works on direct visits.
#   2. COOP/COEP: required by sqlite-wasm's OPFS sync-access VFS (and
#      SharedArrayBuffer in general). Without these, the app boots into an
#      "OPFS unavailable" error and refuses to read the local DB.
#   3. Long-cache for hashed assets, short-cache for HTML and the service
#      worker so PWA updates are visible quickly.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SharedArrayBuffer / OPFS — same-origin isolation. Required by sqlocal.
  # NOTE: nginx's `add_header` does NOT cascade — if a child `location` sets
  # any add_header of its own, the outer ones are dropped for that block.
  # That's why every location below re-declares COOP/COEP/CORP.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # Defensive defaults.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Don't cache HTML or the service worker — they need to update promptly so
  # PWA installs see new builds without a long staleness window.
  location = /index.html {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }
  location = /sw.js {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    try_files /sw.js =404;
  }
  location = /registerSW.js {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    try_files /registerSW.js =404;
  }
  location = /manifest.webmanifest {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    try_files /manifest.webmanifest =404;
  }

  # Vite emits hashed filenames in /assets — safe to cache aggressively.
  # Workers + wasm under /assets/ need COEP/CORP to load in the isolated doc.
  location /assets/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Health endpoint for Dokploy / orchestrator probes.
  location = /healthz {
    access_log off;
    add_header Content-Type "text/plain" always;
    return 200 "ok\n";
  }

  # Default: SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
